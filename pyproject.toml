[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "coursera-scraper"
version = "0.1.0"
description = "Download videos, subtitles, and transcripts from Coursera courses you are enrolled in"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
hls = ["yt-dlp>=2023.1.0"]

[project.scripts]
coursera-scraper = "coursera_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
