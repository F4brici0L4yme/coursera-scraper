[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "coursera-scraper"
version = "0.2.0"
description = "Download videos, transcripts, readings, and slides from Coursera courses you are enrolled in"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Rodrigo Fabricio Layme Salas", email = "rlaymes@unsa.edu.pe" }]
keywords = ["coursera", "scraper", "download", "notebooklm", "tui", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "argcomplete>=3.7.2",
    "requests>=2.28",
]

[project.urls]
Homepage = "https://github.com/F4brici0L4yme/coursera-scraper"
Repository = "https://github.com/F4brici0L4yme/coursera-scraper"
Issues = "https://github.com/F4brici0L4yme/coursera-scraper/issues"
Changelog = "https://github.com/F4brici0L4yme/coursera-scraper/blob/main/CHANGELOG.md"

[project.optional-dependencies]
hls = ["yt-dlp>=2023.1.0"]
ui = [
    "textual>=0.86.0",
    "pyfiglet>=1.0.2",
]

[project.scripts]
coursera-scraper = "coursera_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.16.7",
]
